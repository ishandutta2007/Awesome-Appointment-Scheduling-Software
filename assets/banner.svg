<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #38bdf8; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      
      @keyframes float1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(20px, -15px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-20px, 15px); }
      }

      .bg-orb1 { animation: float1 8s ease-in-out infinite; }
      .bg-orb2 { animation: float2 10s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Orbs -->
  <g opacity="0.3">
    <circle class="bg-orb1" cx="200" cy="100" r="180" fill="#4f46e5" filter="url(#glow)" />
    <circle class="bg-orb2" cx="1000" cy="300" r="220" fill="#9333ea" filter="url(#glow)" />
    <circle class="bg-orb1" cx="850" cy="80" r="140" fill="#0ea5e9" filter="url(#glow)" />
  </g>

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Cards Container -->
  <g transform="translate(100, 240)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.9" />
    <circle cx="40" cy="50" r="20" fill="#38bdf8" opacity="0.2" />
    <path d="M32 50 L38 56 L48 44" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <text x="75" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">SaaS &amp; Enterprise</text>
    <text x="75" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8">Calendly, HubSpot, Acuity</text>

    <!-- Card 2 -->
    <rect x="360" y="0" width="280" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.9" />
    <circle cx="400" cy="50" r="20" fill="#818cf8" opacity="0.2" />
    <path d="M392 50 L398 56 L408 44" stroke="#818cf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <text x="435" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Open-Source</text>
    <text x="435" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8">Cal.com, Rallly, Easy!Appts</text>

    <!-- Card 3 -->
    <rect x="720" y="0" width="280" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.9" />
    <circle cx="760" cy="50" r="20" fill="#c084fc" opacity="0.2" />
    <path d="M752 50 L758 56 L768 44" stroke="#c084fc" stroke-width="3" fill="none" stroke-linecap="round" />
    <text x="795" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Self-Hosted</text>
    <text x="795" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8">Docker &amp; VPS Ready</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(100, 110)">
    <text x="0" y="40" class="title">Awesome Appointment Scheduling</text>
    <text x="0" y="82" class="subtitle">Curated SaaS Platforms, Self-Hosted Tools &amp; Open-Source Projects</text>
  </g>
</svg>
